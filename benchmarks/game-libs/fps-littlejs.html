<!doctype html>
<meta charset="utf-8">
<title>FPS262626-style LittleJS workload</title>
<style>html,body{margin:0;overflow:hidden;background:#030007}</style>
<script type="module">
import * as L from './node_modules/littlejsengine/dist/littlejs.esm.js';
import { createMeter } from './common.js';
import { FW, FH, makeFPSState, stepFPS } from './fps-style-common.js';

const s=makeFPSState();
const tick=createMeter('FPS262626-style LittleJS',5,{suite:'fps262626-style'});
const color=(hex,a=1)=>{
  const h=hex.replace('#','');
  return new L.Color(parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255,a);
};
const wp=(x,y)=>L.vec2(x-FW/2,FH/2-y);
const line=(x1,y1,x2,y2,w,c,a=1)=>L.drawLine(wp(x1,y1),wp(x2,y2),w,color(c,a));

function gameInit(){
  L.setCanvasFixedSize(L.vec2(FW,FH));
  L.setCameraPos(L.vec2(0,0));
  L.setCameraScale(1);
  L.setCanvasClearColor(color('#030007'));
}
function gameUpdate(){ stepFPS(s,Math.min(.05,L.timeDelta||1/60)); }
function gameRender(){
  L.drawRect(L.vec2(0,0),L.vec2(FW,FH),color('#07000d'));
  const hy=FH*.65,vx=FW/2;
  line(0,hy,FW,hy,1,'#bf00ff',.16);
  for(let x=-FW;x<=FW*2;x+=120) line(vx,hy,x,FH,1,'#bf00ff',.16);
  for(let y=hy;y<=FH;y+=(FH-y)*.28+14) line(0,y,FW,y,1,'#bf00ff',.16);
  L.drawCircle(wp(FW/2,hy-40),360,color('#bf00ff',0),1,color('#bf00ff',.08));
  L.drawCircle(wp(FW/2,hy-40),520,color('#bf00ff',0),1,color('#bf00ff',.08));

  for(const t of s.targets){
    const r=t.type.radius,c=t.type.color;
    L.drawCircle(wp(t.x,t.y),r*2,color(c,0),3,color(c,t.alpha));
    for(let i=0;i<4;i++){
      const a=t.ringRotation+i*Math.PI/2,ca=Math.cos(a),sa=Math.sin(a);
      const p=(x,y)=>[t.x+x*ca-y*sa,t.y+x*sa+y*ca];
      const p1=p(r-4,-4),p2=p(r+6,0),p3=p(r-4,4);
      line(p1[0],p1[1],p2[0],p2[1],2,c,t.alpha);
      line(p2[0],p2[1],p3[0],p3[1],2,c,t.alpha);
    }
    L.drawCircle(wp(t.x,t.y),r*1.1,color('#ffffff',0),1.5,color('#ffffff',.4*t.alpha));
    L.drawCircle(wp(t.x,t.y),r*.56,color('#ffffff',t.alpha));
    L.drawCircle(wp(t.x,t.y),(r+8)*2,color(c,0),2,color(c,t.alpha*.8));
  }

  for(const tr of s.tracers) line(tr.startX,tr.startY,tr.endX,tr.endY,3,'#00f0ff',tr.alpha);
  for(const p of s.particles) L.drawRect(wp(p.x,p.y),L.vec2(p.size),color(p.color,p.alpha));
  for(const t of s.floatingTexts) L.drawText(t.text,wp(t.x,t.y),t.big?24:16,color(t.color,t.alpha),0,L.BLACK,'center');

  if(s.muzzleFlash>0){
    L.drawRect(L.vec2(0,0),L.vec2(FW,FH),color('#bf00ff',.18*s.muzzleFlash));
    L.drawCircle(wp(740,FH-20),280,color('#bf00ff',.12*s.muzzleFlash));
    L.drawCircle(wp(740,FH-20),140,color('#ff007f',.22*s.muzzleFlash));
  }

  const x=s.crosshair.x,y=s.crosshair.y,gap=8,len=18;
  L.drawCircle(wp(x,y),5,color('#00f0ff'));
  line(x,y-gap,x,y-gap-len,1.8,'#00f0ff');
  line(x,y+gap,x,y+gap+len,1.8,'#00f0ff');
  line(x-gap,y,x-gap-len,y,1.8,'#00f0ff');
  line(x+gap,y,x+gap+len,y,1.8,'#00f0ff');
  L.drawCircle(wp(x,y),(gap+len+3)*2,color('#00f0ff',0),1,color('#00f0ff',.25));
}
L.engineInit(gameInit,gameUpdate,()=>{},gameRender,tick,[]);
</script>
