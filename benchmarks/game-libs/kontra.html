<!doctype html>
<meta charset="utf-8">
<title>Kontra benchmark</title>
<style>html,body{margin:0;overflow:hidden;background:#111}canvas{display:block}</style>
<canvas id="game" width="800" height="600"></canvas>
<script type="module">
import { init, Sprite, GameLoop } from './node_modules/kontra/kontra.mjs';
import { W, H, SIZE, params, position, velocity, createMeter } from './common.js';

const { n } = params();
const canvas = document.querySelector('#game');
init(canvas);

const sprites = [];
for (let i = 0; i < n; i++) {
  const p = position(i);
  const v = velocity(i);
  sprites.push(Sprite({
    x: p.x, y: p.y,
    width: SIZE, height: SIZE,
    color: '#5ab4f0',
    dx: v.x * 60,
    dy: v.y * 60,
  }));
}

const tick = createMeter('Kontra', n);
const loop = GameLoop({
  update(dt) {
    for (const s of sprites) {
      s.x += s.dx * dt;
      s.y += s.dy * dt;
      if (s.x < 0) { s.x = 0; s.dx = Math.abs(s.dx); }
      else if (s.x > W - SIZE) { s.x = W - SIZE; s.dx = -Math.abs(s.dx); }
      if (s.y < 0) { s.y = 0; s.dy = Math.abs(s.dy); }
      else if (s.y > H - SIZE) { s.y = H - SIZE; s.dy = -Math.abs(s.dy); }
    }
  },
  render() {
    for (const s of sprites) s.render();
    tick();
  },
});
loop.start();
</script>
