name: Game library benchmark

on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/game-libs/**'
      - '.github/workflows/game-lib-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install benchmark dependencies
        working-directory: benchmarks/game-libs
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: benchmarks/game-libs
        run: npx playwright install --with-deps chromium
      - name: Run benchmark
        working-directory: benchmarks/game-libs
        run: node run.mjs
      - name: Show results
        run: cat benchmarks/game-libs/results/latest.md
      - uses: actions/upload-artifact@v4
        with:
          name: game-lib-benchmark-results
          path: benchmarks/game-libs/results/
